# SubAgent CLI Configuration
# Select your preferred CLI vendor for sub-agent execution

# Default CLI vendor (used as fallback when oma-config.yaml is not configured)
# For per-agent CLI mapping, see: .agents/oma-config.yaml
#
# NOTE (2026-05-22): Antigravity is Google's replacement for the deprecated
# Gemini CLI. Antigravity reuses the `.gemini/agents/` folder for compatibility
# but is invoked via the `antigravity` command. Set `active_vendor: gemini` here
# only if you are intentionally targeting the deprecated Gemini CLI.
active_vendor: antigravity

# Vendor configurations
vendors:
  antigravity:
    command: antigravity
    subcommand: chat
    prompt_flag: none
    # Antigravity does not support headless JSON subprocess mode.
    # Use `antigravity chat` interactively with the oh-my-agent plugin instead.
    # Reference: oma agent:spawn -m antigravity returns an explicit error.
    isolation_method: "interactive"

  gemini:
    # DEPRECATED: Replaced by Antigravity as of 2026-05.
    # Kept only for users still relying on the legacy Gemini CLI.
    command: gemini
    prompt_flag: "-p"
    output_format_flag: "--output-format"
    output_format: "json"
    auto_approve_flag: "--approval-mode=yolo"
    model_flag: "-m"
    default_model: "auto"
    include_dirs_flag: "--include-directories"
    response_jq: ".response"
    isolation_method: "directory"

  claude:
    command: claude
    prompt_flag: "-p"
    output_format_flag: "--output-format"
    output_format: "json"
    auto_approve_flag: "--dangerously-skip-permissions"
    model_flag: "--model"
    default_model: "sonnet"
    response_jq: ".result"
    isolation_method: "flags"

  codex:
    command: codex
    subcommand: "exec"
    prompt_flag: "none"
    output_format_flag: "--json"
    isolation_flags: "-s read-only --skip-git-repo-check --ephemeral"
    model_flag: "-m"
    default_model: "gpt-5.5"
    response_jq: ".response"
    isolation_method: "flags"

  qwen:
    command: qwen
    prompt_flag: "-p"
    output_format_flag: "--output-format"
    output_format: "json"
    auto_approve_flag: "--yolo"
    model_flag: "-m"
    default_model: "qwen3.6-plus"
    response_jq: ".output"
    isolation_method: "directory"

  # Cursor Agent headless CLI: `cursor agent -p …` (--print). Prompt is positional.
  # Models: run `cursor agent models` (legacy fallback: `cursor agent --list-models`).
  # `auto` lets Cursor route to an available model (quota-friendly); pin to a specific
  # id (e.g. composer-2.5, composer-2.5-fast) for reproducibility.
  cursor:
    command: cursor
    prompt_flag: none
    output_format_flag: "--output-format"
    output_format: "json"
    auto_approve_flag: "--yolo"
    model_flag: "--model"
    default_model: "auto"
    isolation_method: "directory"

# SubAgent execution settings
execution:
  # Directory for subagent results
  results_dir: ".agents/results"
  # Timeout in seconds (0 = no timeout)
  timeout: 600
  # Log level: debug, info, warn, error
  log_level: info
  # Keep intermediate files for debugging
  keep_temp_files: false
