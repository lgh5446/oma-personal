<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>할 일 목록</h1>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요">
      <button type="submit">추가</button>
    </form>
    <ul id="todo-list"></ul>
    <div class="stats">
      <span id="total-count">총 0개</span>
      <span id="done-count">완료 0개</span>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
